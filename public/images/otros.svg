<svg width="400" height="200" viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8c564b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6d4430;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="200" fill="url(#bg)"/>
  
  <!-- Title -->
  <text x="20" y="30" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white">Otros</text>
  
  <!-- Government building -->
  <rect x="50" y="80" width="60" height="80" fill="none" stroke="white" stroke-width="2"/>
  <rect x="55" y="85" width="50" height="70" fill="none" stroke="white" stroke-width="1"/>
  
  <!-- Columns -->
  <line x1="65" y1="80" x2="65" y2="160" stroke="white" stroke-width="1"/>
  <line x1="75" y1="80" x2="75" y2="160" stroke="white" stroke-width="1"/>
  <line x1="85" y1="80" x2="85" y2="160" stroke="white" stroke-width="1"/>
  <line x1="95" y1="80" x2="95" y2="160" stroke="white" stroke-width="1"/>
  
  <!-- Flag -->
  <rect x="110" y="60" width="40" height="25" fill="white"/>
  <line x1="150" y1="60" x2="150" y2="100" stroke="white" stroke-width="2"/>
  
  <!-- Regulatory symbols -->
  <circle cx="200" cy="100" r="30" fill="none" stroke="white" stroke-width="2"/>
  <text x="200" y="105" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white" text-anchor="middle">R</text>
  
  <!-- Money/coins -->
  <circle cx="280" cy="100" r="20" fill="none" stroke="white" stroke-width="2"/>
  <text x="280" y="105" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">$</text>
  
  <circle cx="320" cy="100" r="20" fill="none" stroke="white" stroke-width="2"/>
  <text x="320" y="105" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">$</text>
  
  <!-- Labels -->
  <text x="50" y="180" font-family="Arial, sans-serif" font-size="12" fill="white">Estado</text>
  <text x="200" y="180" font-family="Arial, sans-serif" font-size="12" fill="white">Regulación</text>
  <text x="280" y="180" font-family="Arial, sans-serif" font-size="12" fill="white">Cargos</text>
  
  <!-- Arrows showing flow -->
  <g stroke="white" stroke-width="2" fill="white">
    <polygon points="170,100 180,95 180,105" />
    <polygon points="250,100 260,95 260,105" />
  </g>
</svg>


